<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found: The Studio by Rahul Wala</title>
<script>
  // The Studio - iPhone lives at /iphone/ inside this site. GitHub sends every
  // unknown address here, including a reload deep inside the app, so send
  // those back to the app with the address it needs.
  (function () {
    var p = location.pathname;
    if (p.toLowerCase().indexOf('/iphone/') === 0 || p.toLowerCase() === '/iphone') {
      var tail = p.slice('/iphone'.length).replace(/^\/?/, '/');
      location.replace('/iphone/?__path=' + encodeURIComponent('/iphone' + tail + location.search + location.hash));
    }
  })();
</script>
<style>
  :root { --paper: #faf8f4; --ink: #1c1916; --ink-2: #403a33; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper: #08080b; --ink: #f5f5f5; --ink-2: #cccccc; color-scheme: dark; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.6 system-ui, sans-serif; padding: 48px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { color: var(--ink-2); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>That page isn't here</h1>
  <p>The address may be old. Everything is on the <a href="/">home page of The Studio</a>.</p>
</main>
</body>
</html>
